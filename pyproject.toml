[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotlinkdoctor"
version = "0.1.0"
description = "Detect broken or ambiguous symlinks in dotfile trees"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dotfiles", "symlinks", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/felixhartmannnn/dotlinkdoctor"

[project.optional-dependencies]
cli = ["typer>=0.9"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
dotlinkdoctor = "dotlinkdoctor.main:main"

[project.entry-points."console_scripts"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.inioptions]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
